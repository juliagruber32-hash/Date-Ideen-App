# Prüft bei jeder Änderung, ob alle Dateien fehlerfrei sind und die Logik stimmt (kostenlos).
name: Prüfen
on:
  push:
  pull_request:
jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax aller Programmdateien
        run: for f in js/*.js sw.js; do node --input-type=module --check < "$f" || exit 1; done
      - name: Ideen-Datei ist gültig
        run: node -e "JSON.parse(require('fs').readFileSync('data/ideas.json','utf8'))"
      - name: Logik-Tests
        run: node tests/run.mjs
