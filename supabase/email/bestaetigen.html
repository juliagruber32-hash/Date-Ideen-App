<!-- Supabase → Authentication → Emails → „Confirm signup“
     Betreff: Willkommen bei Datewell – bitte bestätige deine E-Mail-Adresse -->
<div style="background:#F3EFE8;padding:32px 16px;font-family:Georgia,'Times New Roman',serif;color:#302B29">
  <div style="max-width:480px;margin:0 auto;background:#FBF9F5;border:1px solid #E5DDD3;border-radius:18px;padding:32px 28px;text-align:center">
    <div style="font-size:38px;color:#562F37;letter-spacing:.01em">Date<em>well</em></div>
    <div style="font-style:italic;color:#7A6F66;font-size:16px;margin-top:4px">For the moments that matter.</div>
    <h1 style="font-weight:normal;font-size:26px;margin:28px 0 10px">Schön, dass du da bist.</h1>
    <p style="font-family:Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:#4A433F;margin:0 0 24px">
      Bitte bestätige noch kurz deine E-Mail-Adresse – dann kann es losgehen mit eurem nächsten Date.
    </p>
    <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#562F37;color:#F3EFE8;text-decoration:none;font-family:Helvetica,Arial,sans-serif;font-size:16px;font-weight:600;padding:14px 28px;border-radius:12px">E-Mail-Adresse bestätigen</a>
    <p style="font-family:Helvetica,Arial,sans-serif;font-size:12px;line-height:1.5;color:#8C827A;margin:28px 0 0">
      Du hast dich nicht bei Datewell registriert? Dann kannst du diese E-Mail einfach ignorieren.
    </p>
  </div>
</div>
